name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run check --prefix backend
      - run: npm run check:luau --prefix backend
      - run: npm test --prefix backend
      - run: npm run build --prefix backend
      - run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check src backend/tests/luau
