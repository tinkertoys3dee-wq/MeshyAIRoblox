<path d="M252 582 L322 562" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.50"/><path d="M266 572 L336 552" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.35"/><path d="M280 562 L350 542" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.20"/><g filter="url(#softShadowBadgeFirstInviteSent)"><path d="M366 512 L718 370 L608 698 L508 528 Z" fill="#FFFFFF"/><path d="M508 528 L608 698 L564 578 Z" fill="#E4E9FF" opacity="0.8"/><path d="M508 528 L718 370" stroke="#C9D2F2" stroke-width="6" opacity="0.6"/></g>  </g>
