<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeCompletionist" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FFE7B0"/>
      <stop offset="38%" stop-color="#E8A526"/>
      <stop offset="78%" stop-color="#A66A0E"/>
      <stop offset="100%" stop-color="#A66A0E"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeCompletionist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBadgeCompletionist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoBadgeCompletionist" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterBadgeCompletionist" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#F0C866"/>
      <stop offset="45%" stop-color="#6B4408"/>
      <stop offset="55%" stop-color="#6B4408"/>
      <stop offset="100%" stop-color="#F0C866"/>
    </linearGradient>
