<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeFirstTryOn" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FFE7B0"/>
      <stop offset="38%" stop-color="#E8A526"/>
      <stop offset="78%" stop-color="#A66A0E"/>
      <stop offset="100%" stop-color="#A66A0E"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeFirstTryOn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBadgeFirstTryOn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoBadgeFirstTryOn" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterBadgeFirstTryOn" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#F0C866"/>
      <stop offset="45%" stop-color="#6B4408"/>
      <stop offset="55%" stop-color="#6B4408"/>
      <stop offset="100%" stop-color="#F0C866"/>
    </linearGradient>
    <linearGradient id="ringInnerBadgeFirstTryOn" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#6B4408"/>
      <stop offset="50%" stop-color="#F0C866"/>
      <stop offset="100%" stop-color="#6B4408"/>
    </linearGradient>
    <linearGradient id="enamelBadgeFirstTryOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE3F5"/>
    </linearGradient>
    <clipPath id="clipBadgeFirstTryOn"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowBadgeFirstTryOn" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B0E1E" flood-opacity="0.42"/>
    </filter>
    <filter id="tinyShadowBadgeFirstTryOn" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B0E1E" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlowBadgeFirstTryOn" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
  <circle cx="512.0" cy="512.0" r="492" fill="url(#ringOuterBadgeFirstTryOn)"/>
  <circle cx="512.0" cy="512.0" r="478" fill="url(#ringInnerBadgeFirstTryOn)"/>
  <circle cx="512.0" cy="512.0" r="462" fill="url(#sphereBadgeFirstTryOn)"/>
  <g clip-path="url(#clipBadgeFirstTryOn)">
    <circle cx="512.0" cy="512.0" r="462" fill="url(#aoBadgeFirstTryOn)" style="mix-blend-mode:multiply"/>
    <ellipse cx="362.0" cy="302.0" rx="330" ry="230" fill="url(#glossBadgeFirstTryOn)"/>
    <ellipse cx="302.0" cy="252.0" rx="90" ry="60" fill="url(#hotspotBadgeFirstTryOn)"/>
    <circle cx="512.0" cy="512.0" r="458" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="10"/>
<g filter="url(#softShadowBadgeFirstTryOn)"><circle cx="512" cy="472" r="168" fill="url(#hotspotBadgeFirstTryOn)"/><circle cx="512" cy="472" r="168" fill="#E8F6FF" opacity="0.28"/><circle cx="512" cy="472" r="168" fill="none" stroke="#FFFFFF" stroke-width="26"/><circle cx="512" cy="472" r="168" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="6"/><path d="M416 372 C 452 322 522 312 582 342" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.75"/><path d="M472 612 L442 742 a20 20 0 0 0 20 24 h100 a20 20 0 0 0 20 -24 L552 612 Z" fill="#FFFFFF"/><path d="M492 692 L532 692" stroke="#000000" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/></g>  </g>
