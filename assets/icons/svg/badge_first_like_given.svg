<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeFirstLikeGiven" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FFC0D6"/>
      <stop offset="38%" stop-color="#E8437F"/>
      <stop offset="78%" stop-color="#A0224E"/>
      <stop offset="100%" stop-color="#A0224E"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeFirstLikeGiven" cx="50%" cy="50%" r="50%">
