      <stop offset="55%" stop-color="#6B1636"/>
      <stop offset="100%" stop-color="#F088AC"/>
    </linearGradient>
    <linearGradient id="ringInnerBadgeFirstLikeGiven" x1="18%" y1="10%" x2="82%" y2="92%">
