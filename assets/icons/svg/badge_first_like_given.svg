<g filter="url(#softShadowBadgeFirstLikeGiven)"><path d="M512 672 C 282 532 322 332 472 372 C 502 380 512 402 512 422 C 512 402 522 380 552 372 C 702 332 742 532 512 672 Z" fill="#FFFFFF"/><path d="M512 672 C 632 592 702 462 632 372 C 582 350 522 392 512 422 C 502 482 502 582 512 672 Z" fill="#FFE0EA" opacity="0.6"/><path d="M372 432 C 402 382 452 362 492 372" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.7"/></g><path d="M662 374 L667.4 386.6 L680 392 L667.4 397.4 L662 410 L656.6 397.4 L644 392 L656.6 386.6 Z" fill="#FFFFFF" opacity="0.8"/>  </g>
