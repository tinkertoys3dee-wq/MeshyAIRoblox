  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
  <circle cx="512.0" cy="512.0" r="492" fill="url(#ringOuterBadgeFirstLikeGiven)"/>
  <circle cx="512.0" cy="512.0" r="478" fill="url(#ringInnerBadgeFirstLikeGiven)"/>
  <circle cx="512.0" cy="512.0" r="462" fill="url(#sphereBadgeFirstLikeGiven)"/>
  <g clip-path="url(#clipBadgeFirstLikeGiven)">
