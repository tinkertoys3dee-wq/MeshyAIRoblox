    <clipPath id="clipBadgeFirstLikeGiven"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowBadgeFirstLikeGiven" x="-40%" y="-40%" width="180%" height="180%">
