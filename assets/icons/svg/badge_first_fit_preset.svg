    <linearGradient id="enamelBadgeFirstFitPreset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE3F5"/>
    </linearGradient>
    <clipPath id="clipBadgeFirstFitPreset"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowBadgeFirstFitPreset" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B0E1E" flood-opacity="0.42"/>
    </filter>
    <filter id="tinyShadowBadgeFirstFitPreset" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B0E1E" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlowBadgeFirstFitPreset" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
