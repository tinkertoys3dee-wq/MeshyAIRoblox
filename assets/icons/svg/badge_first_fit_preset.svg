<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeFirstFitPreset" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#A8ECFF"/>
      <stop offset="38%" stop-color="#29B8E0"/>
      <stop offset="78%" stop-color="#146E8C"/>
      <stop offset="100%" stop-color="#146E8C"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeFirstFitPreset" cx="50%" cy="50%" r="50%">
