      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBadgeFirstFitPreset" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoBadgeFirstFitPreset" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterBadgeFirstFitPreset" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#6ED4EE"/>
      <stop offset="45%" stop-color="#0B4658"/>
      <stop offset="55%" stop-color="#0B4658"/>
      <stop offset="100%" stop-color="#6ED4EE"/>
    </linearGradient>
    <linearGradient id="ringInnerBadgeFirstFitPreset" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#0B4658"/>
