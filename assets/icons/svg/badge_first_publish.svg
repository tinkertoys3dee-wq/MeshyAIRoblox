<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeFirstPublish" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#B6F5D9"/>
      <stop offset="38%" stop-color="#34C98C"/>
      <stop offset="78%" stop-color="#167A54"/>
      <stop offset="100%" stop-color="#167A54"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeFirstPublish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBadgeFirstPublish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoBadgeFirstPublish" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterBadgeFirstPublish" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#7FE0B7"/>
      <stop offset="45%" stop-color="#0E4A34"/>
      <stop offset="55%" stop-color="#0E4A34"/>
      <stop offset="100%" stop-color="#7FE0B7"/>
    </linearGradient>
    <linearGradient id="ringInnerBadgeFirstPublish" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#0E4A34"/>
      <stop offset="50%" stop-color="#7FE0B7"/>
      <stop offset="100%" stop-color="#0E4A34"/>
    </linearGradient>
    <linearGradient id="enamelBadgeFirstPublish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE3F5"/>
    </linearGradient>
    <clipPath id="clipBadgeFirstPublish"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowBadgeFirstPublish" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B0E1E" flood-opacity="0.42"/>
    </filter>
    <filter id="tinyShadowBadgeFirstPublish" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B0E1E" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlowBadgeFirstPublish" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
  <circle cx="512.0" cy="512.0" r="492" fill="url(#ringOuterBadgeFirstPublish)"/>
  <circle cx="512.0" cy="512.0" r="478" fill="url(#ringInnerBadgeFirstPublish)"/>
  <circle cx="512.0" cy="512.0" r="462" fill="url(#sphereBadgeFirstPublish)"/>
  <g clip-path="url(#clipBadgeFirstPublish)">
    <circle cx="512.0" cy="512.0" r="462" fill="url(#aoBadgeFirstPublish)" style="mix-blend-mode:multiply"/>
