    <ellipse cx="302.0" cy="252.0" rx="90" ry="60" fill="url(#hotspotBadgeFirstPublish)"/>
    <circle cx="512.0" cy="512.0" r="458" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="10"/>
<path d="M488 652.0 L536 652.0" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.50"/><path d="M502 649.2 L522 649.2" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.35"/><path d="M516 646.4 L508 646.4" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.20"/><path d="M372 662 h280 a16 16 0 0 1 16 16 v20 a16 16 0 0 1 -16 16 h-280 a16 16 0 0 1 -16 -16 v-20 a16 16 0 0 1 16 -16 Z" fill="#FFFFFF" opacity="0.85"/><g filter="url(#softShadowBadgeFirstPublish)"><path d="M512 322 L416 472 L472 472 L472 632 L512 632 Z" fill="#FFFFFF"/><path d="M512 322 L608 472 L552 472 L552 632 L512 632 Z" fill="#E4E9FF" opacity="0.92"/></g>  </g>
