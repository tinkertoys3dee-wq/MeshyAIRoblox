<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereBadgeGroupJoined" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#C9B8FF"/>
      <stop offset="38%" stop-color="#7C56E8"/>
      <stop offset="78%" stop-color="#4B2FA8"/>
      <stop offset="100%" stop-color="#4B2FA8"/>
    </radialGradient>
    <radialGradient id="hotspotBadgeGroupJoined" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossBadgeGroupJoined" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoBadgeGroupJoined" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterBadgeGroupJoined" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#A48EF0"/>
      <stop offset="45%" stop-color="#2E1C70"/>
      <stop offset="55%" stop-color="#2E1C70"/>
      <stop offset="100%" stop-color="#A48EF0"/>
    </linearGradient>
    <linearGradient id="ringInnerBadgeGroupJoined" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#2E1C70"/>
      <stop offset="50%" stop-color="#A48EF0"/>
      <stop offset="100%" stop-color="#2E1C70"/>
    </linearGradient>
    <linearGradient id="enamelBadgeGroupJoined" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE3F5"/>
    </linearGradient>
    <clipPath id="clipBadgeGroupJoined"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowBadgeGroupJoined" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B0E1E" flood-opacity="0.42"/>
    </filter>
    <filter id="tinyShadowBadgeGroupJoined" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B0E1E" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlowBadgeGroupJoined" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
  <circle cx="512.0" cy="512.0" r="492" fill="url(#ringOuterBadgeGroupJoined)"/>
  <circle cx="512.0" cy="512.0" r="478" fill="url(#ringInnerBadgeGroupJoined)"/>
  <circle cx="512.0" cy="512.0" r="462" fill="url(#sphereBadgeGroupJoined)"/>
  <g clip-path="url(#clipBadgeGroupJoined)">
    <circle cx="512.0" cy="512.0" r="462" fill="url(#aoBadgeGroupJoined)" style="mix-blend-mode:multiply"/>
    <ellipse cx="362.0" cy="302.0" rx="330" ry="230" fill="url(#glossBadgeGroupJoined)"/>
    <ellipse cx="302.0" cy="252.0" rx="90" ry="60" fill="url(#hotspotBadgeGroupJoined)"/>
    <circle cx="512.0" cy="512.0" r="458" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="10"/>
<g filter="url(#softShadowBadgeGroupJoined)"><circle cx="372" cy="472" r="76" fill="url(#enamelBadgeGroupJoined)" opacity="0.55"/><path d="M244 732 A128 176 0 0 1 500 732 Z" fill="url(#enamelBadgeGroupJoined)" opacity="0.55"/></g><g filter="url(#softShadowBadgeGroupJoined)"><circle cx="602" cy="492" r="96" fill="url(#enamelBadgeGroupJoined)" opacity="1.0"/><path d="M442 752 A160 216 0 0 1 762 752 Z" fill="url(#enamelBadgeGroupJoined)" opacity="1.0"/></g>  </g>
</svg>
