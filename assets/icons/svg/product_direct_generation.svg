<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sphereProductDirectGeneration" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#A8ECFF"/>
      <stop offset="38%" stop-color="#29B8E0"/>
      <stop offset="78%" stop-color="#146E8C"/>
      <stop offset="100%" stop-color="#146E8C"/>
    </radialGradient>
    <radialGradient id="hotspotProductDirectGeneration" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glossProductDirectGeneration" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aoProductDirectGeneration" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuterProductDirectGeneration" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#6ED4EE"/>
      <stop offset="45%" stop-color="#0B4658"/>
      <stop offset="55%" stop-color="#0B4658"/>
      <stop offset="100%" stop-color="#6ED4EE"/>
    </linearGradient>
    <linearGradient id="ringInnerProductDirectGeneration" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#0B4658"/>
      <stop offset="50%" stop-color="#6ED4EE"/>
      <stop offset="100%" stop-color="#0B4658"/>
    </linearGradient>
    <linearGradient id="enamelProductDirectGeneration" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE3F5"/>
    </linearGradient>
    <clipPath id="clipProductDirectGeneration"><circle cx="512.0" cy="512.0" r="462"/></clipPath>
    <filter id="softShadowProductDirectGeneration" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0B0E1E" flood-opacity="0.42"/>
    </filter>
    <filter id="tinyShadowProductDirectGeneration" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B0E1E" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlowProductDirectGeneration" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- outer bevel ring: two concentric strokes read as a rounded metal edge -->
  <circle cx="512.0" cy="512.0" r="492" fill="url(#ringOuterProductDirectGeneration)"/>
  <circle cx="512.0" cy="512.0" r="478" fill="url(#ringInnerProductDirectGeneration)"/>
  <circle cx="512.0" cy="512.0" r="462" fill="url(#sphereProductDirectGeneration)"/>
  <g clip-path="url(#clipProductDirectGeneration)">
    <circle cx="512.0" cy="512.0" r="462" fill="url(#aoProductDirectGeneration)" style="mix-blend-mode:multiply"/>
    <ellipse cx="362.0" cy="302.0" rx="330" ry="230" fill="url(#glossProductDirectGeneration)"/>
    <ellipse cx="302.0" cy="252.0" rx="90" ry="60" fill="url(#hotspotProductDirectGeneration)"/>
    <circle cx="512.0" cy="512.0" r="458" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="10"/>
<g filter="url(#softShadowProductDirectGeneration)"><path d="M512 332 L512 412 L322 482 Z" fill="#FFFFFF" opacity="0.92"/><path d="M512 332 L702 482 L512 412 Z" fill="#E4E9FF" opacity="0.8"/><path d="M322 482 L512 412 L512 712 Z" fill="#C9D6FF" opacity="0.62"/><path d="M702 482 L512 412 L512 712 Z" fill="#8FA3E8" opacity="0.55"/><path d="M512 332 L322 482 M512 332 L512 412 M512 332 L702 482 M322 482 L512 712 M512 412 L512 712 M702 482 L512 712 M322 482 L512 412 L702 482" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9" stroke-linejoin="round"/></g><path d="M680 328 L687.8 346.2 L706 354 L687.8 361.8 L680 380 L672.2 361.8 L654 354 L672.2 346.2 Z" fill="#FFFFFF" opacity="0.92"/>  </g>
</svg>
