<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160" viewBox="0 0 220 160"><defs>
    <!-- ============ BACKDROP ============ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#160E33"/>
      <stop offset="38%" stop-color="#2A1355"/>
      <stop offset="70%" stop-color="#4B1B60"/>
      <stop offset="100%" stop-color="#7E2A4A"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA23A" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#FF6B2B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arcaneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FD8FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7FD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE6B0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFE6B0" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ GOLD METAL ============ -->
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="28%" stop-color="#F7CB66"/>
      <stop offset="55%" stop-color="#D69A2C"/>
      <stop offset="78%" stop-color="#F3C561"/>
      <stop offset="100%" stop-color="#9C6A18"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE7A8"/>
      <stop offset="100%" stop-color="#C4901F"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6D8"/>
      <stop offset="100%" stop-color="#C08C22"/>
    </linearGradient>

    <!-- ============ PANEL GLASS ============ -->
    <linearGradient id="panelGlass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#33205E"/>
      <stop offset="45%" stop-color="#241645"/>
      <stop offset="100%" stop-color="#1A1035"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inkWell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120B26"/>
      <stop offset="100%" stop-color="#1D1240"/>
    </linearGradient>

    <!-- ============ MOLTEN CTA ============ -->
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDE8A"/>
      <stop offset="22%" stop-color="#FFA53C"/>
      <stop offset="58%" stop-color="#F4682A"/>
      <stop offset="100%" stop-color="#C13A1E"/>
    </linearGradient>
    <linearGradient id="moltenSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ GEMS ============ -->
    <linearGradient id="gemCyan" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#C8F6FF"/>
      <stop offset="45%" stop-color="#49C9F0"/>
      <stop offset="100%" stop-color="#1A6FA8"/>
    </linearGradient>
    <linearGradient id="gemRose" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFD3EC"/>
      <stop offset="45%" stop-color="#FF74C0"/>
      <stop offset="100%" stop-color="#A62A7A"/>
    </linearGradient>
    <linearGradient id="gemMint" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#CFFFEA"/>
      <stop offset="45%" stop-color="#4FE0A6"/>
      <stop offset="100%" stop-color="#177C56"/>
    </linearGradient>
    <linearGradient id="gemAmethyst" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8D6FF"/>
      <stop offset="45%" stop-color="#A879FF"/>
      <stop offset="100%" stop-color="#5B2C9E"/>
    </linearGradient>
    <linearGradient id="gemGold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#FFC444"/>
      <stop offset="100%" stop-color="#A96C10"/>
    </linearGradient>
    <linearGradient id="gemRuby" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFD0D6"/>
      <stop offset="45%" stop-color="#FF5F72"/>
      <stop offset="100%" stop-color="#96162C"/>
    </linearGradient>

    <!-- crystal faces for the illustration -->
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAFBFF"/>
      <stop offset="100%" stop-color="#6FD4F5"/>
    </linearGradient>
    <linearGradient id="facetB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ED6F7"/>
      <stop offset="100%" stop-color="#2A73C9"/>
    </linearGradient>
    <linearGradient id="facetC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9ECFF"/>
      <stop offset="100%" stop-color="#3E97DA"/>
    </linearGradient>

    <!-- progress troughs -->
    <linearGradient id="fillGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7A0"/>
      <stop offset="50%" stop-color="#FFB43C"/>
      <stop offset="100%" stop-color="#D77C14"/>
    </linearGradient>
    <linearGradient id="fillMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8FFE2"/>
      <stop offset="50%" stop-color="#43DFA0"/>
      <stop offset="100%" stop-color="#189367"/>
    </linearGradient>
    <linearGradient id="fillCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDF3FF"/>
      <stop offset="50%" stop-color="#4EC8F2"/>
      <stop offset="100%" stop-color="#1B7BB0"/>
    </linearGradient>

    <linearGradient id="emberSprite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0AE"/>
      <stop offset="45%" stop-color="#FFB03C"/>
      <stop offset="100%" stop-color="#F0632A"/>
    </linearGradient>

    <!-- ============ FILTERS ============ -->
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#080416" flood-opacity="0.72"/>
    </filter>
    <filter id="popShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0A0518" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-45%" y="-45%" width="190%" height="190%">
      
      <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#FFC24A" flood-opacity="0.75"/>
    </filter>
    <filter id="moltenGlow" x="-25%" y="-80%" width="150%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#FF8A2B" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#080416" flood-opacity="0.65"/>
    </filter>
    <filter id="arcGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#66D9FF" flood-opacity="0.85"/>
    </filter>
    <filter id="softBlur" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="tinyBlur" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- ============ ORNAMENTS ============ -->
    <g id="cornerOrn">
      <path d="M7 44 C7 22 22 7 44 7" fill="none" stroke="url(#goldBar)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M7 62 C7 31 31 7 62 7" fill="none" stroke="url(#goldSoft)" stroke-width="1.2" opacity="0.7"/>
      <path d="M20 20 l7.5 -7.5 7.5 7.5 -7.5 7.5 z" fill="url(#goldBar)"/>
      <path d="M44 7 c9 0 14 -2.5 17 -7" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M7 44 c0 9 -2.5 14 -7 17" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="62" cy="7" r="2.4" fill="url(#goldBar)"/>
      <circle cx="7" cy="62" r="2.4" fill="url(#goldBar)"/>
    </g>

    <g id="rivet">
      <circle r="5" fill="url(#goldBar)"/>
      <circle r="2.4" fill="#FFF4CE" opacity="0.9"/>
      <circle r="5" fill="none" stroke="#6E4410" stroke-width="0.9" opacity="0.8"/>
    </g>

    <g id="flourish">
      <path d="M-132 0 C -92 -13, -48 -13, -17 0" fill="none" stroke="url(#goldSoft)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M132 0 C 92 -13, 48 -13, 17 0" fill="none" stroke="url(#goldSoft)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-132 0 c -10 0 -16 5 -18 12" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <path d="M132 0 c 10 0 16 5 18 12" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <path d="M0 -11 l11 11 -11 11 -11 -11 z" fill="url(#gemGold)" stroke="#8A5A12" stroke-width="1"/>
      <circle cx="-24" cy="2" r="2.6" fill="url(#goldBar)"/>
      <circle cx="24" cy="2" r="2.6" fill="url(#goldBar)"/>
    </g>

    <g id="sparkle">
      <path d="M0 -16 C2 -5 5 -2 16 0 C5 2 2 5 0 16 C-2 5 -5 2 -16 0 C-5 -2 -2 -5 0 -16 Z" fill="#FFF6D8"/>
    </g>
  </defs>
  <g transform="translate(110.0,80.0) scale(1.0)">
    <ellipse cx="0" cy="34" rx="86" ry="20" fill="#3A2560" stroke="url(#goldBar)" stroke-width="2.6"/>
    <path d="M-46 34 L-42 -46 C-42 -56 42 -56 42 -46 L46 34 Z" fill="#2E1B54" stroke="url(#goldBar)" stroke-width="2.6"/>
    <ellipse cx="0" cy="-46" rx="42" ry="11" fill="#3A2560" stroke="url(#goldBar)" stroke-width="2.2"/>
    <path d="M-45 14 L45 14 L44 -2 L-44 -2 Z" fill="url(#gemGold)" stroke="#8A5A12" stroke-width="1.6"/>
    <circle cx="26" cy="6" r="7" fill="url(#gemRuby)" stroke="#FFF3C4" stroke-width="1.6"/>
    <g stroke="#C9A24A" stroke-width="1.4" opacity="0.8" fill="none">
      <path d="M-30 -34 c10 -6 22 -6 32 0"/><path d="M-24 -20 c8 -5 18 -5 26 0"/>
    </g>
  </g></svg>